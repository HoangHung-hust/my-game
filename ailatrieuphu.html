<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Ai Là Triệu Phú</title>

<style>
body{
    margin:0;
    background:radial-gradient(circle at top, #1b2b52, #020824);
    font-family:Tahoma, Arial;
    color:#fff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{ width:900px; text-align:center; }

#title{
    font-size:36px;
    color:#ffd700;
    text-shadow:0 0 10px #ffd700;
    margin-bottom:20px;
}

#questionBox {
    border: 3px solid #ffd700;
    border-radius: 20px;
    padding: 25px;
    font-size: 22px; /* Có thể giảm xuống 20px nếu bạn hay dùng câu hỏi dài */
    background: #06132a;
    margin-bottom: 20px;
    
    /* min-height: 100px; 
    display: flex;
    align-items: center;
    justify-content: center;
    word-wrap: break-word; 
    overflow-wrap: break-word; */
}

#answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    padding:15px;
    border-radius:30px;
    background:#0b2a4d;
    border:2px solid #1e90ff;
    cursor:pointer;
    font-size:18px;
    text-align:left;
}

.answer span{ color:#ffd700; font-weight:bold; }

.correct{ background:#2ecc71!important; color:#000; }
.wrong{ background:#e74c3c!important; }

@keyframes blinkGreen{
    0%{ box-shadow:0 0 5px #2ecc71; }
    50%{ box-shadow:0 0 25px #2ecc71; background:#2ecc71; color:#000;}
    100%{ box-shadow:0 0 5px #2ecc71; }
}
.blink{ animation:blinkGreen .5s infinite; }

#lifelines{
    display:flex;
    justify-content:space-around;
    margin:20px 0;
}

.lifeline{
    background:#ffd700;
    color:#000;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}
.lifeline.used{
    opacity:.4;
    pointer-events:none;
}

#info{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

/* POPUP */
#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

#popupContent{
    background:linear-gradient(#0b2a4d,#06132a);
    border:3px solid #ffd700;
    border-radius:25px;
    padding:25px;
    width:420px;
    text-align:center;
    box-shadow:0 0 25px rgba(255,215,0,.5);
}

/* BIỂU ĐỒ CỘT DỌC */
.chart{
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    height:200px;
    margin-top:20px;
}

.col{
    width:50px;
    background:#1e90ff;
    text-align:center;
    border-radius:10px 10px 0 0;
    position:relative;
}

.col span{
    position:absolute;
    top:-25px;
    width:100%;
    font-size:14px;
}

.col label{
    display:block;
    margin-top:5px;
    font-weight:bold;
}

/* RESTART */
#restart{
    margin-top:20px;
    padding:10px 20px;
    font-size:18px;
    border:none;
    border-radius:20px;
    background:#ffd700;
    cursor:pointer;
}

.popup-btn{
    margin-top:15px;
    padding:10px 30px;
    border:none;
    border-radius:25px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(#ffd700,#ffb400);
    color:#000;
    box-shadow:0 3px 10px rgba(255,215,0,.6);
}

.popup-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #ffd700;
}
</style>
</head>

    gameQuestions = [];
    currentIndex = 0;

    // --- RESET CÁC NÚT TRỢ GIÚP ---
    const lifelines = document.querySelectorAll(".lifeline");
    lifelines.forEach(btn => {
        btn.classList.remove("used");
    });

    // chia câu hỏi theo level
    let byLevel = {
    1: QUESTIONS.filter(q=>q.level===1),
    2: QUESTIONS.filter(q=>q.level===2),
    3: QUESTIONS.filter(q=>q.level===3),
    4: QUESTIONS.filter(q=>q.level===4)
    };

    // random từng level
    shuffle(byLevel[1]);
    shuffle(byLevel[2]);
    shuffle(byLevel[3]);
    shuffle(byLevel[4]);

    // lấy số lượng theo yêu cầu
    gameQuestions.push(
    ...byLevel[1].slice(0,4),   // câu 1-4
    ...byLevel[2].slice(0,4),   // câu 5-8
    ...byLevel[3].slice(0,4),   // câu 9-12
    ...byLevel[4].slice(0,3)    // câu 13-15
    );

    loadQuestion();
}

/* === MONEY === */
function formatMoney(num){
    return num.toLocaleString("vi-VN");
}

function updateMoney(){
    moneyDiv.innerText =
        "Số tiền hiện tại: " +
        formatMoney(prizeMoney[currentIndex]) +
        " ₫";
}

/* ===== LOAD ===== */
function loadQuestion(){
    locked = false;
    currentQ = gameQuestions[currentIndex];
    qBox.innerText = `${currentQ.q}`;

    // Tự động đổi màu viền dựa trên Level
    if(currentQ.level === 1) qBox.style.borderColor = "#00ff00"; // Xanh lá
    else if(currentQ.level === 2) qBox.style.borderColor = "#ffd700"; // Vàng
    else if(currentQ.level === 3) qBox.style.borderColor = "#ff8c00"; // Cam
    else if(currentQ.level === 4) qBox.style.borderColor = "#ff0000"; // Đỏ rực rỡ

    // reset đáp án
    aDiv.innerHTML="";
    answerMap = currentQ.a.map((t,i)=>({t, ok:i===currentQ.c}));
    shuffle(answerMap);
    activeAnswers = [...answerMap];

    answerMap.forEach((o,i)=>{
    let d=document.createElement("div");
    d.className="answer";
    d.innerHTML=`<span>${String.fromCharCode(65+i)}.</span> ${o.t}`;
    d.onclick=()=>choose(d,o.ok);
    aDiv.appendChild(d);
    });

    questionDiv.innerText = `Câu ${currentIndex+1}/15`;
    moneyDiv.innerText =
    "Số tiền hiện tại: " +
    formatMoney(prizeMoney[currentIndex]) +
    " ₫";

}

function choose(div,ok){
 if(locked) return;
 locked = true;

 const answers=[...document.querySelectorAll(".answer")];
 const correctDiv=answers[answerMap.findIndex(x=>x.ok)];

 correctDiv.classList.add("blink");
 setTimeout(()=>{
  correctDiv.classList.remove("blink");
  correctDiv.classList.add("correct");
 },1500);

 if(!ok){
  div.classList.add("wrong");
  setTimeout(showRestart,2000);
  return;
 }

 setTimeout(()=>{
  currentIndex++;
  updateMoney();

  // chiến thắng
  if(currentIndex === 15){
   showPopup("🎉 CHIẾN THẮNG",
    "Chúc mừng bạn đã trở thành <b> TRIỆU PHÚ</b> 🏆");
   return;
  }

  loadQuestion();
 },2200);
}

/* ===== LIFELINES ===== */
function use5050(btn){
    btn.classList.add("used");

    let wrong = activeAnswers.filter(a=>!a.ok);
    shuffle(wrong);

    // loại 2 đáp án sai
    wrong.slice(0,2).forEach(w=>{
    activeAnswers = activeAnswers.filter(a=>a!==w);

    [...aDiv.children].forEach(d=>{
    if(d.innerText.includes(w.t)){
        d.innerHTML = d.innerHTML.replace(w.t,"");
        d.onclick = null;
        d.style.cursor="default";
    }
    });
    });
}

function callBro(btn){
 btn.classList.add("used");

 let level = currentQ.level;
 let correct = activeAnswers.find(a=>a.ok);
 let others = activeAnswers.filter(a=>!a.ok);
 shuffle(others);

 let text = "";

 // LEVEL 1 & 2: chắc chắn đúng
 if(level <= 2){
  text = `
   Câu này dễ mà 😎  
   Anh học mấy cái này từ năm nhất rồi.  
   Đáp án chắc chắn là <b>${correct.t}</b>.
  `;
 }

 // LEVEL 3: phân vân – 50/50
 else if(level === 3){
  let isRight = Math.random() < 0.5;
  let ans = isRight ? correct : others[0];

  text = `
   Câu này bắt đầu khoai rồi 🤔  
   Anh không dám chắc lắm…  
   Nhưng cảm giác của anh đang nghiêng về  
   <b>${ans.t}</b>.
  `;
 }

 // LEVEL 4: random biết / không biết
 else{
  let know = Math.random() < 0.5;

  // biết → đúng
  if(know){
   text = `
    À câu này thì anh biết 😏  
    Ngày xưa từng gặp rồi.  
    Không phải nghĩ nhiều, đáp án là  
    <b>${correct.t}</b>.
   `;
  }
  // không biết → hên xui
  else{
   let ans = activeAnswers[Math.floor(Math.random()*activeAnswers.length)];
   text = `
    😵‍💫 Thú thật với chú…  
    Câu này anh cũng chịu.  
    Nếu đoán thì anh đoán đại  
    <b>${ans.t}</b>, hên xui thôi nha.
   `;
  }
 }

 showPopup("📞 Ông anh 96 BK", text);
}


function askAudience(btn){
 btn.classList.add("used");

 let data = answerMap.map((a,i)=>{
  // nếu đã bị loại bởi 50/50 → 0%
  if(!activeAnswers.includes(a)){
   return {label:String.fromCharCode(65+i), p:0};
  }

  let p = a.ok
    ? 55 + Math.random()*25
    : 5 + Math.random()*15;

  return {label:String.fromCharCode(65+i), p};
 });

 // chuẩn hóa về 100%
 let sum = data.reduce((s,x)=>s+x.p,0);
 data.forEach(d=>{
  d.p = sum ? Math.round(d.p/sum*100) : 0;
 });

 let html = `
 <b>Ý kiến khán giả trường quay</b>
 <div class="chart" style="
   display:flex;
   justify-content:space-around;
   align-items:flex-end;
   margin-top:20px;
   height:260px;
 ">`;

 data.forEach(d=>{
  html+=`
   <div style="
     display:flex;
     flex-direction:column;
     align-items:center;
     width:70px;
   ">
     <!-- % phía trên -->
     <div style="
       margin-bottom:6px;
       font-weight:bold;
       font-size:16px;
       color:${d.p===0?'#888':'#ffd700'};
     ">
       ${d.p}%
     </div>

     <!-- cột -->
     <div style="
       height:${d.p*2}px;
       width:42px;
       background:${d.p===0
         ? '#444'
         : 'linear-gradient(to top,#1e90ff,#6fbfff)'};
       border-radius:10px 10px 0 0;
     "></div>

     <!-- nhãn A B C D -->
     <div style="margin-top:8px;font-weight:bold">
       ${d.label}
     </div>
   </div>`;
 });

 html += "</div>";

 showPopup("👥 Khán giả", html);
}

function askAI(btn){
 btn.classList.add("used");

 let level = currentQ.level;

 // LEVEL 1 & 2: khẳng định chắc chắn
 if(level <= 2){
  let correct = activeAnswers.find(a=>a.ok);
  showPopup("🤖 AI",
   `
   Dựa trên dữ liệu huấn luyện và phân tích ngữ nghĩa,  
   AI xác định đáp án đúng là  
   <b>${correct.t}</b>.
   `
  );
  return;
 }

 // LEVEL 3 & 4: phân tích xác suất
 let data = activeAnswers.map(a=>{
  let p = a.ok
    ? 65 + Math.random()*20   // ≈80% đúng
    : 10 + Math.random()*15;
  return {t:a.t, p};
 });

 let sum = data.reduce((s,x)=>s+x.p,0);
 data.forEach(d=>d.p=Math.round(d.p/sum*100));

 let best = [...data].sort((a,b)=>b.p-a.p)[0];

 let html = `
 <b>Phân tích xác suất của AI</b>
 <table style="width:100%;margin-top:10px">
 `;

 data.forEach(d=>{
  html+=`
   <tr>
     <td>${d.t}</td>
     <td style="text-align:right;font-weight:bold">${d.p}%</td>
   </tr>
  `;
 });

 html += `
 </table>
 <p style="margin-top:10px">
 Đáp án có xác suất cao nhất là  
 <b>${best.t}</b>.  
 Tuy nhiên, AI vẫn tồn tại sai số.
 </p>
 `;

 showPopup("🤖 Hỏi AI", html);
}

/* ===== POPUP ===== */
function showPopup(title,content){
 popupContent.innerHTML = `
   <h2 style="color:#ffd700;margin-top:0">${title}</h2>
   <div style="margin:15px 0;font-size:16px">${content}</div>
   <button class="popup-btn" onclick="popup.style.display='none'">
     Đóng
   </button>
 `;
 popup.style.display="flex";
}

function showRestart(){
 showPopup("💥 KẾT THÚC",
  `
  Bạn đã dừng cuộc chơi tại câu ${currentIndex+1}.<br><br>
  <button class="popup-btn" onclick="popup.style.display='none';startGame()">
   Chơi lại
  </button>
  `
 );
}

function closePopup(){
 popup.style.display="none";
 locked=false; // QUAN TRỌNG: cho chơi tiếp
}

/* ===== GAME OVER ===== */
function gameOver(){
 popupContent.innerHTML=`
  <h2>BẠN ĐÃ THUA</h2>
  <p>Tiền thưởng: ${money[idx]}k</p>
  <button id="restart" onclick="location.reload()">Chơi lại</button>
 `;
 popup.style.display="flex";
}

startGame();

</script>
